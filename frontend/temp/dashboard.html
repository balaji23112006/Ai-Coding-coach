<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - AI Coding Coach</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #111827;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: #1f2937;
      --error-color: #ef4444;
      --success-color: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 550px;
      padding: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 40px 32px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      position: relative;
    }

    .header {
      margin-bottom: 24px;
      text-align: center;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .info-list {
      margin: 24px 0;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
    }

    .info-row {
      display: flex;
      padding: 16px;
      background: #1f2937;
      border-bottom: 1px solid var(--border-color);
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      width: 120px;
      font-weight: 600;
      color: var(--text-muted);
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .info-value {
      flex: 1;
      color: var(--text-main);
      font-size: 15px;
    }

    .btn-logout {
      width: 100%;
      padding: 14px;
      background: var(--error-color);
      border: none;
      border-radius: 8px;
      color: white;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s ease-in-out;
      margin-top: 10px;
    }

    .btn-logout:hover {
      opacity: 0.9;
    }

    .loading {
      text-align: center;
      color: var(--text-muted);
      font-size: 16px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <div class="header">
      <h1>Coding Coach Studio</h1>
      <p id="subheading">Access authorized. Welcome back.</p>
    </div>

    <div id="loading" class="loading">Validating security session...</div>

    <div id="dashboardContent" style="display: none;">
      <div class="info-list">
        <div class="info-row">
          <div class="info-label">User ID</div>
          <div id="userId" class="info-value"></div>
        </div>
        <div class="info-row">
          <div class="info-label">Full Name</div>
          <div id="userFullName" class="info-value"></div>
        </div>
        <div class="info-row">
          <div class="info-label">Username</div>
          <div id="userUsername" class="info-value"></div>
        </div>
        <div class="info-row">
          <div class="info-label">Email</div>
          <div id="userEmail" class="info-value"></div>
        </div>
      </div>

      <button id="logoutBtn" class="btn-logout">Log Out</button>
    </div>
  </div>
</div>

<script>
  const loading = document.getElementById('loading');
  const content = document.getElementById('dashboardContent');
  const logoutBtn = document.getElementById('logoutBtn');

  // Verify Auth on Load
  window.addEventListener('load', async () => {
    try {
      const response = await fetch('/api/auth/me');
      if (!response.ok) {
        // Redirect to login if unauthorized
        window.location.href = 'login.html';
        return;
      }

      const user = await response.json();
      
      document.getElementById('userId').textContent = user.id;
      document.getElementById('userFullName').textContent = user.fullName;
      document.getElementById('userUsername').textContent = user.username;
      document.getElementById('userEmail').textContent = user.email;

      loading.style.display = 'none';
      content.style.display = 'block';
    } catch (err) {
      loading.textContent = 'Connection failed. Please refresh the page.';
    }
  });

  // Handle Logout
  logoutBtn.addEventListener('click', async () => {
    try {
      const response = await fetch('/api/auth/logout', {
        method: 'POST'
      });
      if (response.ok) {
        window.location.href = 'login.html';
      } else {
        alert('Failed to logout cleanly');
      }
    } catch (err) {
      alert('Error during logout request');
    }
  });
</script>

</body>
</html>
